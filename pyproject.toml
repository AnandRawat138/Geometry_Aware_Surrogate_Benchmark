[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry_aware_benchmark"
version = "0.1.0"
description = "A Geometry-Aware Surrogate Benchmark for Extreme-Value Prediction in High-Cost Electromagnetic Simulations (Reconstructed)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["src"]
